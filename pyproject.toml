[project]
name = "basketball-decision-support"
version = "0.1.0"
description = "A small basketball operations API combining SQL, PyTorch, and RAG."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.0",
    "httpx>=0.28.0",
    "nba-api>=1.11.0",
    "numpy>=2.3.0",
    "openai>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.7.0",
    "torch>=2.8.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basketball_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires the local PostgreSQL container",
    "live: calls an external NBA or OpenAI service",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["basketball_api"]

