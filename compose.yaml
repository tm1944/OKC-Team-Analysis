services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: basketball
      POSTGRES_USER: basketball
      POSTGRES_PASSWORD: basketball
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basketball -d basketball"]
      interval: 2s
      timeout: 3s
      retries: 15

